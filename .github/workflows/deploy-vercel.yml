name: Deploy frontend to Vercel

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Simulated Vercel deployment
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production-vercel' || 'preview-vercel' }}
      url: https://example.com/pr-helper-e2e-sandbox/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production-vercel' || 'preview-vercel' }}
        run: |
          set -euo pipefail
          deployment=$(curl --fail-with-body -sS -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"$GITHUB_SHA\",\"environment\":\"$DEPLOY_ENV\",\"description\":\"Simulated Vercel deployment for PR Helper E2E\",\"auto_merge\":false,\"required_contexts\":[]}")
          deployment_id=$(jq -r .id <<< "$deployment")
          curl --fail-with-body -sS -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"success\",\"environment_url\":\"https://example.com/pr-helper-e2e-sandbox/$GITHUB_SHA\",\"description\":\"Simulated Vercel deployment passed\"}"
